<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>理科授業ポータル</title>
<style>
:root{--green:#059669;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f7f9fc}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1120px;margin:auto;padding:48px 24px 80px}.brand{font-size:13px;font-weight:800;letter-spacing:.18em;color:var(--green)}h1{font-size:44px;margin:8px 0 10px}.lead{color:var(--muted)}.section{margin-top:42px}.section-head{display:flex;align-items:center;gap:14px}.section-head div{height:1px;background:var(--line);flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid.two{grid-template-columns:repeat(2,1fr)}button.card{width:100%;min-height:132px;border:1px solid var(--line);border-radius:24px;background:white;padding:20px;text-align:left;cursor:pointer;box-shadow:0 1px 3px #0000000d;transition:.2s}button.card:hover{transform:translateY(-3px);box-shadow:0 10px 25px #00000010}.card h3{font-size:18px;margin:0 0 8px}.card p{margin:0;color:var(--muted)}.tag{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;background:#ecfdf5;color:#047857;font-weight:800;margin-bottom:16px}.nav{display:flex;gap:10px;margin-bottom:28px}.nav button,.homebtn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer}.homebtn{position:fixed;right:24px;bottom:24px;background:#0f172a;color:#fff;box-shadow:0 8px 25px #0003}.placeholder{border:1px dashed #cbd5e1;border-radius:24px;background:white;padding:24px;min-height:150px}small{color:#94a3b8}@media(max-width:760px){.grid,.grid.two{grid-template-columns:1fr}h1{font-size:34px}.wrap{padding:32px 16px 90px}}
</style></head><body><div id="app"></div><script>
const grades=[
{id:'j1',title:'中一理科',sub:'1年生の授業・教材',units:['いろいろな生物とその共通点','身のまわりの物質','光・音・力','大地の変化']},
{id:'j2',title:'中二理科',sub:'2年生の授業・教材',units:['化学変化と原子・分子','生物のからだのつくりとはたらき','電流とその利用','気象とその変化']},
{id:'j3',title:'中三理科',sub:'3年生の授業・教材',units:['化学変化とイオン','生命の連続性','運動とエネルギー','地球と宇宙','自然と人間']},
{id:'high',title:'高校編',sub:'高校理科の教材・発展内容',units:['物理','化学','生物','地学']},
{id:'uni',title:'大学編',sub:'さらに学びたい人へ',units:['物理学','化学','生物学','地球科学','科学史・その他']}];
const app=document.getElementById('app');
function head(title='理科授業ポータル',lead='授業資料・発展学習・質問への入口を、ひとつの場所に。'){return `<div class="brand">SCIENCE PORTAL</div><h1>${title}</h1><p class="lead">${lead}</p>`}
function home(){app.innerHTML=`<main class="wrap">${head()}<section class="section"><div class="section-head"><h2>授業・教材</h2><div></div></div><div class="grid">${grades.map(g=>`<button class="card" onclick="grade('${g.id}')"><span class="tag">理</span><h3>${g.title}</h3><p>${g.sub}</p></button>`).join('')}</div></section><section class="section"><div class="section-head"><h2>資料</h2><div></div></div><div class="grid two"><button class="card"><span class="tag">資</span><h3>理科資料 趣味ver.</h3><p>趣味として集めた理科資料</p></button></div></section><section class="section"><div class="section-head"><h2>質問・Q&amp;A</h2><div></div></div><div class="grid two"><button class="card"><span class="tag">?</span><h3>授業でのわからないことや質問などはコチラ</h3><p>質問を送る</p></button><button class="card"><span class="tag">Q</span><h3>Q&amp;A解答閲覧</h3><p>これまでの質問と回答を見る</p></button></div></section></main>`}
function grade(id){const g=grades.find(x=>x.id===id);app.innerHTML=`<main class="wrap"><div class="nav"><button onclick="home()">← ポータルへ戻る</button></div>${head(g.title,'単元を選択してください。各単元の中に授業資料・問題・参考リンクを追加できます。')}<section class="section"><div class="grid two">${g.units.map((u,i)=>`<button class="card" onclick="unit('${id}',${i})"><span class="tag">${i+1}</span><h3>${u}</h3><p>教材を見る</p></button>`).join('')}</div></section></main><button class="homebtn" onclick="home()">⌂ ホームに戻る</button>`}
function unit(id,i){const g=grades.find(x=>x.id===id),u=g.units[i];app.innerHTML=`<main class="wrap"><div class="nav"><button onclick="grade('${id}')">← ${g.title}へ戻る</button></div>${head(u,'この単元の教材置き場です。')}<section class="section"><div class="grid">${['授業資料','問題・プリント','参考動画・リンク'].map(x=>`<div class="placeholder"><h3>${x}</h3><small>ここに教材やURLを追加できます</small></div>`).join('')}</div></section></main><button class="homebtn" onclick="home()">⌂ ホームに戻る</button>`}home();
</script></body></html>
