<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>理科授業ポータル</title>
<style>
:root{--green:#059669;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f7f9fc}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1120px;margin:auto;padding:48px 24px 80px}.brand{font-size:13px;font-weight:800;letter-spacing:.18em;color:var(--green)}h1{font-size:44px;margin:8px 0 10px}.lead{color:var(--muted)}.section{margin-top:42px}.section-head{display:flex;align-items:center;gap:14px}.section-head div{height:1px;background:var(--line);flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid.two{grid-template-columns:repeat(2,1fr)}button.card,a.card{display:block;width:100%;min-height:132px;border:1px solid var(--line);border-radius:24px;background:white;padding:20px;text-align:left;cursor:pointer;box-shadow:0 1px 3px #0000000d;transition:.2s;color:inherit;text-decoration:none}button.card:hover,a.card:hover{transform:translateY(-3px);box-shadow:0 10px 25px #00000010}.card h3{font-size:18px;margin:0 0 8px}.card p{margin:0;color:var(--muted)}.tag{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 12px;border-radius:14px;background:#ecfdf5;color:#047857;font-weight:800;margin-bottom:16px}.nav{display:flex;gap:10px;margin-bottom:28px}.nav button,.homebtn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer}.homebtn{position:fixed;right:24px;bottom:24px;background:#0f172a;color:#fff;box-shadow:0 8px 25px #0003}.placeholder{border:1px dashed #cbd5e1;border-radius:24px;background:white;padding:24px;min-height:150px}small{color:#94a3b8}@media(max-width:760px){.grid,.grid.two{grid-template-columns:1fr}h1{font-size:34px}.wrap{padding:32px 16px 90px}}
</style></head><body><div id="app"></div><script>
const grades=[
{id:'j1',title:'中一理科',sub:'1年生の授業・教材',units:['中一生物','中一化学','中一物理','中一地学']},
{id:'j2',title:'中二理科',sub:'2年生の授業・教材',units:['中二生物','中二化学','中二物理','中二地学']},
{id:'j3',title:'中三理科',sub:'3年生の授業・教材',units:['中三生物','中三化学','中三物理','中三地学','自然・環境']},
{id:'high',title:'高校編',sub:'高校理科の教材・発展内容',units:['高校物理','高校化学','高校生物','高校地学']},
{id:'uni',title:'大学・薬学編',sub:'薬学を中心に大学での学びへ',units:['薬学','薬学につながる化学','薬学につながる生物','人体・健康','大学・研究の世界']}];
const app=document.getElementById('app');
function head(title='理科授業ポータル',lead='授業資料・発展学習・質問への入口を、ひとつの場所に。'){return `<div class="brand">SCIENCE PORTAL</div><h1>${title}</h1><p class="lead">${lead}</p>`}
function home(){app.innerHTML=`<main class="wrap">${head()}<section class="section"><div class="section-head"><h2>授業・教材</h2><div></div></div><div class="grid">${grades.map(g=>`<button class="card" onclick="grade('${g.id}')"><span class="tag">理</span><h3>${g.title}</h3><p>${g.sub}</p></button>`).join('')}</div></section><section class="section"><div class="section-head"><h2>資料</h2><div></div></div><div class="grid two"><button class="card"><span class="tag">資</span><h3>理科資料 趣味ver.</h3><p>趣味として集めた理科資料</p></button></div></section><section class="section"><div class="section-head"><h2>質問・Q&amp;A</h2><div></div></div><div class="grid two"><button class="card"><span class="tag">?</span><h3>授業でのわからないことや質問などはコチラ</h3><p>質問を送る</p></button><button class="card"><span class="tag">Q</span><h3>Q&amp;A解答閲覧</h3><p>これまでの質問と回答を見る</p></button></div></section></main>`}
function grade(id){const g=grades.find(x=>x.id===id);app.innerHTML=`<main class="wrap"><div class="nav"><button onclick="home()">← ポータルへ戻る</button></div>${head(g.title,'単元を選択してください。各単元の中に授業資料・問題・参考リンクを追加できます。')}<section class="section"><div class="grid two">${g.units.map((u,i)=>`<button class="card" onclick="unit('${id}',${i})"><span class="tag">${i+1}</span><h3>${u}</h3><p>教材を見る</p></button>`).join('')}</div></section></main><button class="homebtn" onclick="home()">⌂ ホームに戻る</button>`}
function unit(id,i){const g=grades.find(x=>x.id===id),u=g.units[i];if(id==='j1'&&u==='中一生物'){window.location.href='biology/index.html';return;}if(id==='j1'&&u==='中一化学'){app.innerHTML=`<main class="wrap"><div class="nav"><button onclick="grade('j1')">← 中一理科へ戻る</button></div>${head('中一化学','物質の性質・密度・気体・水溶液・状態変化を学びます。')}<section class="section"><div class="grid two"><div class="placeholder"><h3>物質の性質</h3><small>教材を順次追加できます</small></div><div class="placeholder"><h3>密度</h3><small>教材を順次追加できます</small></div><div class="placeholder"><h3>気体の性質</h3><small>教材を順次追加できます</small></div><a class="card" href="water-solution/index.html"><span class="tag">水</span><h3>水溶液</h3><p>物質が水に溶けるとは・質量パーセント濃度・溶解度・再結晶</p></a><div class="placeholder"><h3>状態変化</h3><small>教材を順次追加できます</small></div></div></section></main><button class="homebtn" onclick="home()">⌂ ホームに戻る</button>`;return;}app.innerHTML=`<main class="wrap"><div class="nav"><button onclick="grade('j1')">← 中一理科へ戻る</button></div>${head('中一化学','学習する内容を選択してください。')}<section class="section"><div class="grid two"><a class="card" href="water-solution/index.html"><span class="tag">水</span><h3>水溶液</h3><p>物質が水に溶けるとは・質量パーセント濃度・溶解度・再結晶</p></a><div class="placeholder"><h3>その他の教材</h3><small>密度・気体・状態変化などを順次追加できます</small></div></div></section></main><button class="homebtn" onclick="home()">⌂ ホームに戻る</button>`;return;}const subjectMap={
'中二生物':['生物の体のつくりとはたらき','植物の体のつくりとはたらき','動物の体のつくりとはたらき'],
'中二化学':['物質の成り立ち','化学変化','化学変化と物質の質量'],
'中二物理':['電流と回路','電流と磁界','電気の利用'],
'中二地学':['気象観測','天気の変化','日本の気象'],
'中三生物':['生物の成長と生殖','遺伝の規則性','生物の多様性と進化'],
'中三化学':['水溶液とイオン','酸・アルカリとイオン','化学変化と電池'],
'中三物理':['力のつり合いと合成・分解','運動の規則性','仕事とエネルギー'],
'中三地学':['地球の運動と天体','太陽系と恒星'],
'自然・環境':['自然界のつながり','自然環境と人間','科学技術と人間'],
'高校物理':['物理基礎','力学','波動','電磁気','熱・原子'],
'高校化学':['化学基礎','物質の状態と平衡','物質の変化と平衡','無機化学','有機化学'],
'高校生物':['生物基礎','生命現象と物質','生殖と発生','生物の環境応答','生態と進化'],
'高校地学':['地学基礎','地球の概観','地球の活動と歴史','大気と海洋','宇宙'],
'薬学':['薬はどうやって効くのか','薬の吸収・分布・代謝・排泄','薬の剤形','医薬品ができるまで'],
'薬学につながる化学':['有機化学','生化学','分析化学','物理化学'],
'薬学につながる生物':['細胞','遺伝子・DNA','タンパク質','免疫','微生物'],
'人体・健康':['人体のしくみ','神経系','循環器','消化器','内分泌'],
'大学・研究の世界':['大学では理科をどう学ぶ？','実験・研究とは？','論文とは？','薬学部では何を学ぶ？']};
const list=subjectMap[u];
if(list){app.innerHTML=`<main class="wrap"><div class="nav"><button onclick="grade('${id}')">← ${g.title}へ戻る</button></div>${head(u,'分野を選択してください。教材は順次追加できます。')}<section class="section"><div class="grid two">${list.map((x,n)=>`<div class="placeholder"><span class="tag">${n+1}</span><h3>${x}</h3><small>教材を順次追加できます</small></div>`).join('')}</div></section></main><button class="homebtn" onclick="home()">⌂ ホームに戻る</button>`;return;}
app.innerHTML=`<main class="wrap"><div class="nav"><button onclick="grade('${id}')">← ${g.title}へ戻る</button></div>${head(u,'この単元の教材置き場です。')}<section class="section"><div class="grid">${['授業資料','問題・プリント','参考動画・リンク'].map(x=>`<div class="placeholder"><h3>${x}</h3><small>ここに教材やURLを追加できます</small></div>`).join('')}</div></section></main><button class="homebtn" onclick="home()">⌂ ホームに戻る</button>`}home();
</script></body></html>
