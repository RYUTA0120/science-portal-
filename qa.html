<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みんなのQ&A | 理科授業ポータル</title><style>:root{--g:#059669;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f7f9fc}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:1040px;margin:auto;padding:44px 22px 90px}.brand{font-size:13px;font-weight:800;letter-spacing:.16em;color:var(--g)}h1{font-size:40px;margin:8px 0}.lead{color:var(--muted);line-height:1.75}.section{margin-top:38px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{display:block;border:1px solid var(--line);border-radius:22px;background:#fff;padding:20px;color:inherit;text-decoration:none;box-shadow:0 1px 3px #0000000d}.card:hover{box-shadow:0 9px 22px #00000012}.tag{display:inline-block;background:#ecfdf5;color:#047857;padding:6px 10px;border-radius:10px;font-size:12px;font-weight:800}.name{font-size:18px;font-weight:800;margin:12px 0 5px}.meta{font-size:13px;color:#94a3b8;line-height:1.6}.back{display:inline-block;background:#0f172a;color:#fff;text-decoration:none;padding:11px 15px;border-radius:13px;font-weight:700;margin-bottom:25px}.notice{margin-top:22px;padding:17px;border:1px solid var(--line);background:#fff;border-radius:17px}input,select{padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;font:inherit;width:100%}@media(max-width:700px){.grid,.grid3{grid-template-columns:1fr}h1{font-size:32px}}</style></head><body><main><a class="back" href="index.html">← ポータルへ戻る</a><div class="brand">SCIENCE PORTAL / Q&amp;A</div><h1>みんなのQ&amp;A</h1><p class="lead">公開許可のある質問を匿名で掲載します。</p><div class="grid" style="margin-top:25px"><input id="search" placeholder="キーワードで検索"><select id="cat"><option value="">すべての分野</option><option>中一生物</option><option>中一化学</option><option>中一物理</option><option>中一地学</option><option>中二生物</option><option>中二化学</option><option>中二物理</option><option>中二地学</option><option>中三生物</option><option>中三化学</option><option>中三物理</option><option>中三地学</option><option>自然・環境</option><option>高校物理</option><option>高校化学</option><option>高校生物</option><option>高校地学</option><option>薬学</option><option>薬学につながる化学</option><option>薬学につながる生物</option><option>人体・健康</option><option>大学・研究の世界</option></select></div><div id="empty" class="notice">Q&amp;Aはこれから追加していきます。</div><div id="list"></div><script src="qa-data.js"></script><script>const a=window.QA_DATA||[],l=document.getElementById('list'),e=document.getElementById('empty'),s=document.getElementById('search'),c=document.getElementById('cat');function r(){const q=s.value.toLowerCase(),v=c.value,x=a.filter(z=>(!v||z.category===v)&&(!q||((z.question||'')+' '+(z.answer||'')+' '+(z.unit||'')).toLowerCase().includes(q)));l.innerHTML='';e.style.display=x.length?'none':'block';x.forEach(z=>{const d=document.createElement('div');d.className='card';d.style.marginTop='14px';d.innerHTML='<span class="tag"></span><div class="name"></div><div class="lead"></div>';d.querySelector('.tag').textContent=z.category+(z.unit?'｜'+z.unit:'');d.querySelector('.name').textContent='Q. '+z.question;d.querySelector('.lead').textContent='A. '+z.answer;l.appendChild(d)})}s.oninput=r;c.onchange=r;r();</script></main></body></html>
