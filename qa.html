<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>みんなのQ&A | 理科授業ポータル</title>
<style>:root{--g:#059669;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f7f9fc}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:980px;margin:auto;padding:42px 22px 90px}.brand{font-size:13px;font-weight:800;letter-spacing:.15em;color:var(--g)}h1{font-size:40px;margin:8px 0}.lead{color:var(--muted);line-height:1.75}.tools{display:grid;grid-template-columns:1fr 230px;gap:12px;margin:26px 0}input,select{padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff;font:inherit}.qa,.notice{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:14px}.q{font-size:18px;font-weight:800;line-height:1.6}.a{margin-top:12px;line-height:1.8;white-space:pre-wrap}.tag{display:inline-block;background:#ecfdf5;color:#047857;border-radius:10px;padding:5px 9px;font-size:12px;font-weight:800;margin-bottom:10px}.back{display:inline-block;background:#0f172a;color:#fff;text-decoration:none;padding:11px 15px;border-radius:13px;font-weight:700;margin-bottom:25px}@media(max-width:650px){.tools{grid-template-columns:1fr}h1{font-size:32px}}</style></head>
<body><main><a class="back" href="index.html">← ポータルへ戻る</a><div class="brand">SCIENCE PORTAL / Q&amp;A</div><h1>みんなのQ&amp;A</h1><p class="lead">公開許可のある質問を匿名で掲載しています。</p><div class="tools"><input id="search" placeholder="キーワードで検索"><select id="cat"><option value="">すべての分野</option></select></div><div id="status" class="notice">Q&amp;Aを読み込んでいます…</div><div id="list"></div></main>
<script>
const PUB_ID='2PACX-1vRf-TNvgWv0-_WQeZx4v0KHqefIEt-PkWdqZaJdxVPp6k2VKEmdypGRxFJpgMm7hyZSY66Sj6N32_7n';
const GID='575951089';
const statusEl=document.getElementById('status'),list=document.getElementById('list'),search=document.getElementById('search'),cat=document.getElementById('cat');let data=[];
function render(){const q=search.value.trim().toLowerCase(),c=cat.value;const rows=data.filter(x=>(!c||x.category===c)&&(!q||(x.category+' '+x.unit+' '+x.question+' '+x.answer).toLowerCase().includes(q)));list.innerHTML='';statusEl.style.display=rows.length?'none':'block';if(!rows.length)statusEl.textContent=data.length?'該当するQ&Aがありません。':'Q&Aはこれから追加していきます。';rows.forEach(x=>{const d=document.createElement('div');d.className='qa';d.innerHTML='<span class="tag"></span><div class="q"></div><div class="a"></div>';d.querySelector('.tag').textContent=x.category+(x.unit?'｜'+x.unit:'');d.querySelector('.q').textContent='Q. '+x.question;d.querySelector('.a').textContent='A. '+x.answer;list.appendChild(d)})}
const callback='qaCallback_'+Date.now();let done=false;const timer=setTimeout(()=>{if(!done)statusEl.textContent='Q&Aの読み込みがタイムアウトしました。公開用Q&Aの公開設定を確認してください。'},10000);
window[callback]=function(res){done=true;clearTimeout(timer);try{if(!res||!res.table)throw Error('データなし');const cols=res.table.cols||[];const labels=cols.map(c=>(c.label||'').trim());const find=names=>{for(const n of names){let i=labels.indexOf(n);if(i>=0)return i}return -1};let ic=find(['分野']),iu=find(['単元']),iq=find(['質問']),ia=find(['解答','回答']);if([ic,iu,iq,ia].some(i=>i<0)){ic=0;iu=1;iq=2;ia=3}data=(res.table.rows||[]).map(r=>{const get=i=>r.c&&r.c[i]&&r.c[i].v!=null?String(r.c[i].v):'';return{category:get(ic),unit:get(iu),question:get(iq),answer:get(ia)}}).filter(x=>x.question&&x.answer);[...new Set(data.map(x=>x.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja')).forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;cat.appendChild(o)});render()}catch(e){console.error(e);statusEl.textContent='Q&Aデータは取得できましたが、内容を読み取れませんでした。公開用Q&Aの4列（分野・単元・質問・解答）を確認してください。'}finally{delete window[callback]}};
const script=document.createElement('script');script.src='https://docs.google.com/spreadsheets/d/e/'+PUB_ID+'/gviz/tq?gid='+GID+'&headers=1&tqx=out:json;responseHandler:'+callback+'&t='+Date.now();script.onerror=()=>{done=true;clearTimeout(timer);statusEl.textContent='Googleスプレッドシートに接続できませんでした。公開設定または公開URLを確認してください。'};document.head.appendChild(script);
search.oninput=render;cat.onchange=render;
</script></body></html>
