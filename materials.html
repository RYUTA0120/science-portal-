<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教材一覧</title><style>:root{--g:#059669;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f7f9fc}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:1040px;margin:auto;padding:42px 22px 90px}h1{font-size:40px;margin:8px 0}.brand{font-size:13px;font-weight:800;letter-spacing:.15em;color:var(--g)}.lead{color:var(--muted);line-height:1.75}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:27px}.card{display:block;padding:20px;border:1px solid var(--line);border-radius:22px;background:#fff;color:inherit;text-decoration:none;box-shadow:0 1px 3px #0000000d}.card:hover{box-shadow:0 9px 22px #00000012}.tag{display:inline-block;background:#ecfdf5;color:#047857;border-radius:11px;padding:7px 11px;font-size:13px;font-weight:800}.name{font-weight:800;font-size:18px;margin:12px 0 5px}.meta{font-size:13px;color:#94a3b8}.back{display:inline-block;background:#0f172a;color:white;text-decoration:none;padding:11px 15px;border-radius:13px;font-weight:700;margin-bottom:25px}.notice{padding:17px;border:1px solid var(--line);background:#fff;border-radius:17px;margin-top:22px}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:32px}}</style></head><body><main><a class="back" href="https://ryuta0120.github.io/science-portal-/">← ポータルへ戻る</a><div class="brand">SCIENCE PORTAL / MATERIALS</div><h1 id="title">教材一覧</h1><p class="lead">この分野に登録されているPDFです。GitHubの対応フォルダへPDFを追加すると自動で表示されます。</p><div id="status" class="notice">読み込み中…</div><div id="list" class="grid"></div></main><script>
const params=new URLSearchParams(location.search), folder=params.get('folder')||'', title=params.get('title')||'教材一覧';
document.getElementById('title').textContent=title;
const status=document.getElementById('status'),list=document.getElementById('list');
if(!/^[a-z0-9-]+$/.test(folder)){status.textContent='教材フォルダが指定されていません。';}else{
const api='https://api.github.com/repos/RYUTA0120/science-portal-/contents/materials/'+folder;
fetch(api,{headers:{'Accept':'application/vnd.github+json'}}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(items=>{
const pdfs=items.filter(x=>x.type==='file'&&x.name.toLowerCase().endsWith('.pdf')).sort((a,b)=>a.name.localeCompare(b.name,'ja'));
if(!pdfs.length){status.textContent='まだPDFはありません。';return} status.style.display='none';
for(const f of pdfs){const a=document.createElement('a');a.className='card';a.target='_blank';a.rel='noopener';a.href='materials/'+folder+'/'+encodeURIComponent(f.name);a.innerHTML='<span class="tag">PDF</span><div class="name"></div><div class="meta">クリックして開く</div>';a.querySelector('.name').textContent=f.name.replace(/\.pdf$/i,'').replace(/[_-]+/g,' ');list.appendChild(a)}
}).catch(e=>{status.textContent='教材一覧を取得できませんでした。少し待って再読み込みしてください。';console.error(e)})}
</script></body></html>
