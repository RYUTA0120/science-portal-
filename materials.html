<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教材一覧 | 理科授業ポータル</title><style>:root{--g:#059669;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f7f9fc}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:1040px;margin:auto;padding:44px 22px 90px}.brand{font-size:13px;font-weight:800;letter-spacing:.16em;color:var(--g)}h1{font-size:40px;margin:8px 0}.lead{color:var(--muted);line-height:1.75}.section{margin-top:38px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{display:block;border:1px solid var(--line);border-radius:22px;background:#fff;padding:20px;color:inherit;text-decoration:none;box-shadow:0 1px 3px #0000000d}.card:hover{box-shadow:0 9px 22px #00000012}.tag{display:inline-block;background:#ecfdf5;color:#047857;padding:6px 10px;border-radius:10px;font-size:12px;font-weight:800}.name{font-size:18px;font-weight:800;margin:12px 0 5px}.meta{font-size:13px;color:#94a3b8;line-height:1.6}.back{display:inline-block;background:#0f172a;color:#fff;text-decoration:none;padding:11px 15px;border-radius:13px;font-weight:700;margin-bottom:25px}.notice{margin-top:22px;padding:17px;border:1px solid var(--line);background:#fff;border-radius:17px}input,select{padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;font:inherit;width:100%}@media(max-width:700px){.grid,.grid3{grid-template-columns:1fr}h1{font-size:32px}}</style></head><body><main><a class="back" href="index.html">← ポータルへ戻る</a><div class="brand">SCIENCE PORTAL / MATERIALS</div><h1 id="title">教材一覧</h1><p class="lead">対応フォルダに追加したPDFを自動表示します。</p><div id="status" class="notice">読み込み中…</div><div id="list" class="grid"></div><script>const p=new URLSearchParams(location.search),folder=p.get('folder')||'',title=p.get('title')||'教材一覧';document.getElementById('title').textContent=title;const st=document.getElementById('status'),list=document.getElementById('list');if(!/^[a-z0-9-]+$/.test(folder))st.textContent='教材フォルダが指定されていません。';else fetch('https://api.github.com/repos/RYUTA0120/science-portal-/contents/materials/'+folder,{headers:{Accept:'application/vnd.github+json'}}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(a=>{const pdf=a.filter(x=>x.type==='file'&&x.name.toLowerCase().endsWith('.pdf')).sort((x,y)=>x.name.localeCompare(y.name,'ja'));if(!pdf.length){st.textContent='まだPDFはありません。';return}st.style.display='none';pdf.forEach(f=>{const e=document.createElement('a');e.className='card';e.target='_blank';e.rel='noopener';e.href='materials/'+folder+'/'+encodeURIComponent(f.name);e.innerHTML='<span class="tag">PDF</span><div class="name"></div><div class="meta">クリックして開く</div>';e.querySelector('.name').textContent=f.name.replace(/\.pdf$/i,'').replace(/[_-]+/g,' ');list.appendChild(e)})}).catch(()=>st.textContent='教材一覧を取得できませんでした。少し待って再読み込みしてください。');</script></main></body></html>
