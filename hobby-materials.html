<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>趣味資料 | 理科授業ポータル</title><style>:root{--a:#7c3aed;--ink:#111827;--muted:#64748b;--line:#e2e8f0;--bg:#f7f7fb}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:1050px;margin:auto;padding:44px 22px 90px}.brand{font-size:13px;font-weight:900;letter-spacing:.16em;color:var(--a)}h1{font-size:42px;margin:8px 0}.lead{color:var(--muted);line-height:1.8}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:30px}.card{display:block;background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;text-decoration:none;color:inherit;box-shadow:0 1px 3px #0000000d}.card:hover{box-shadow:0 10px 25px #00000012;transform:translateY(-2px)}.icon{font-size:27px}.name{font-size:20px;font-weight:900;margin:10px 0 6px}.meta{color:var(--muted);line-height:1.65}.back{display:inline-block;background:#111827;color:#fff;text-decoration:none;padding:11px 15px;border-radius:13px;font-weight:800;margin-bottom:25px}.tag{display:inline-block;background:#f3e8ff;color:#6d28d9;padding:6px 9px;border-radius:10px;font-size:12px;font-weight:800}.notice{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:25px}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:33px}}</style></head><body><main><a class="back" href="hobby.html">← 趣味ver.へ戻る</a><div class="brand">SCIENCE PORTAL / HOBBY</div><h1 id="title">趣味資料</h1><p class="lead">このカテゴリーに追加したPDFを自動表示します。</p><div id="status" class="notice">読み込み中…</div><div id="list" class="grid"></div></main><script>const p=new URLSearchParams(location.search),f=p.get('folder')||'',t=p.get('title')||'趣味資料';document.getElementById('title').textContent=t;const s=document.getElementById('status'),l=document.getElementById('list');if(!/^[a-z-]+$/.test(f))s.textContent='カテゴリーが指定されていません。';else fetch('https://api.github.com/repos/RYUTA0120/science-portal-/contents/hobby/'+f).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(a=>{const pdf=a.filter(x=>x.type==='file'&&x.name.toLowerCase().endsWith('.pdf')).sort((x,y)=>x.name.localeCompare(y.name,'ja'));if(!pdf.length){s.textContent='まだ資料はありません。';return}s.style.display='none';pdf.forEach(x=>{const e=document.createElement('a');e.className='card';e.target='_blank';e.rel='noopener';e.href='hobby/'+f+'/'+encodeURIComponent(x.name);e.innerHTML='<span class="tag">PDF</span><div class="name"></div><div class="meta">クリックして開く</div>';e.querySelector('.name').textContent=x.name.replace(/\.pdf$/i,'').replace(/[_-]+/g,' ');l.appendChild(e)})}).catch(()=>s.textContent='資料一覧を取得できませんでした。');</script></body></html>
